<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHGeniales Mathe · V2.9.1 Stochastik Smoke Test</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 18px;line-height:1.5}
  button{padding:10px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;cursor:pointer}
  pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}
  .ok{color:#176b3a}.bad{color:#a11}
</style>
</head>
<body>
<h1>V2.9.1 Stochastik Smoke Test</h1>
<p>Entwicklungswerkzeug. Führt 1.000 Zufallsaufgaben je Generator aus und prüft nur technische Invarianten.</p>
<button id="run">Test starten</button>
<pre id="out">Noch nicht ausgeführt.</pre>
<script src="./v2_9_1_registry.js"></script>
<script src="./v2_9_1_stochastik_ergebnisraum.js"></script>
<script src="./v2_9_1_stochastik_ereignisse.js"></script>
<script src="./v2_9_1_stochastik_vierfeldertafel.js"></script>
<script>
(() => {
  const out=document.getElementById('out');
  const N=1000;
  function runOne(name, generator, validator){
    const errors=[];
    for(let i=0;i<N;i++){
      let q;
      try{ q=generator(); }catch(e){ errors.push(`${name}: generator threw at #${i}: ${e.message}`); break; }
      let result;
      try{ result=validator(q); }catch(e){ errors.push(`${name}: validator threw at #${i}: ${e.message}`); break; }
      if(!result.ok){ errors.push(`${name}: invalid task #${i}: ${result.errors.join(', ')}`); break; }
    }
    return errors;
  }

  document.getElementById('run').onclick=()=>{
    const errors=[];
    const reg=globalThis.GHGenialesV291;
    if(!reg) errors.push('Registry nicht geladen.');
    else if(!reg.validateSkillRegistry().ok) errors.push('Registry ist formal ungültig.');

    const st=globalThis.GHGenialesV291Stochastik;
    if(!st) errors.push('Ergebnisraum-Modul nicht geladen.');
    else errors.push(...runOne('Ergebnisraum',st.genErgebnisraum,st.validateErgebnisraum));

    const ev=globalThis.GHGenialesV291StochastikEreignisse;
    if(!ev) errors.push('Ereignisse-Modul nicht geladen.');
    else errors.push(...runOne('Ereignisse',ev.genEreignisse,ev.validateEreignisse));

    const vf=globalThis.GHGenialesV291StochastikVierfeldertafel;
    if(!vf) errors.push('Vierfeldertafel-Modul nicht geladen.');
    else errors.push(...runOne('Vierfeldertafel',vf.genVierfeldertafel,vf.validateVierfeldertafel));

    out.className=errors.length?'bad':'ok';
    out.textContent=(errors.length?'FAIL':'PASS')+`\n\nSamples je Generator: ${N}\nGesamt Samples: ${N*3}\n`+(errors.length?'\n'+errors.join('\n'):'Keine technischen Invarianten verletzt.');
  };
})();
</script>
</body>
</html>
