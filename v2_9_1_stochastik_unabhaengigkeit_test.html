<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.9.1 Unabhängigkeit Smoke Test</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 16px}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:10px}.ok{color:green}.bad{color:#b00}</style></head><body><h1>V2.9.1 · Unabhängigkeit Smoke Test</h1><pre id="out">Starte Test…</pre><script src="v2_9_1_stochastik_unabhaengigkeit.js"></script><script>

for(let i=0;i<1000;i++){check('intersection '+i,GHGenialesV291Unabhaengigkeit.genUnabhaengigkeit);check('conditional '+i,GHGenialesV291Unabhaengigkeit.genUnabhaengigkeitBedingt)}
