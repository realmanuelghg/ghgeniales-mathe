<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.9.1 · Ergebnisraum Test</title><style>body{font:16px system-ui,sans-serif;max-width:820px;margin:30px auto;padding:0 16px;line-height:1.5}.ok{color:#176b3a}.bad{color:#a11}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:10px}.q{padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0}.opt{padding:4px 7px;margin:3px;border:1px solid #ccc;border-radius:8px;background:#fff}</style></head><body><h1>Ergebnisraum · Generator-Audit</h1><p>Entwicklungsseite, nicht Teil der Produktion.</p><pre id="report">Teste…</pre><div id="samples"></div><script src="./v2_9_1_stochastik_ergebnisraum.js"></script><script>(()=>{const out=document.getElementById('report'),wrap=document.getElementById('samples');const api=globalThis.GHGenialesV291Stochastik;if(!api){out.className='bad';out.textContent='FAIL: Generator nicht geladen.';return}let failures=[];const counts={};for(let i=0;i<500;i++){const q=api.genErgebnisraum();const v=api.validateErgebnisraum(q);if(!v.ok)failures.push({i,errors:v.errors,q});counts[q.variant]=(counts[q.variant]||0)+1}const lines=[`Samples: 500`,`Varianten: ${JSON.stringify(counts)}`,`Validierung: ${failures.length?'FAIL':'PASS'}`];if(failures.length)lines.push(...failures.slice(0,10).map(f=>`#${f.i}: ${f.errors.join(', ')}`));out.className=failures.length?'bad':'ok';out.textContent=lines.join('\n');for(let i=0;i<5;i++){const q=api.genErgebnisraum(),d=document.createElement('div');d.className='q';d.innerHTML=`<strong>${q.prompt}</strong><div>${q.formula}</div>${q.options.map((o,j)=>`<button class="opt">${j+1}. ${o}${j===q.correctIndex?' ✓':''}</button>`).join('')}<p><small>${q.explain}</small></p>`;wrap.appendChild(d)}})();</script></body></html>
